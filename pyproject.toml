[project]
name = "moonscreen"
version = "0.1.0"
description = "Home Assistant switch that drives Foundation Sunshine's virtual desktop"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["custom_components", "tests", "tools"]
extend-exclude = [".venv", ".venv-ha", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM117"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
]
